<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Keluarga Sihombing</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            min-height: 100vh;
            padding: 30px 16px;
        }
        .container {
            max-width: 820px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }
        header {
            text-align: center;
            margin-bottom: 24px;
        }
        header h1 {
            font-size: 2rem;
            color: #70e1f5;
            margin-bottom: 6px;
        }
        header p {
            color: #d0dce2;
            font-size: 0.95rem;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 26px;
        }
        .stat-card {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        .stat-card .value {
            font-size: 1.6rem;
            font-weight: bold;
            color: #ffd166;
        }
        .stat-card .label {
            font-size: 0.85rem;
            color: #c2d1d9;
            margin-top: 4px;
        }
        h2 {
            font-size: 1.25rem;
            margin-bottom: 14px;
            color: #70e1f5;
        }
        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 14px;
            margin-bottom: 26px;
        }
        .member-card {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 16px;
        }
        .member-card .role {
            display: inline-block;
            background: rgba(112, 225, 245, 0.2);
            color: #70e1f5;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            margin-bottom: 8px;
        }
        .member-card h3 {
            font-size: 1.1rem;
            margin-bottom: 6px;
        }
        .member-card p {
            font-size: 0.9rem;
            color: #dce6ec;
            line-height: 1.45;
        }
        .agenda-box {
            background: rgba(0, 0, 0, 0.22);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 22px;
        }
        .agenda-list {
            list-style: decimal inside;
            margin-bottom: 14px;
        }
        .agenda-list li {
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.95rem;
        }
        .agenda-form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        input {
            flex: 1;
            min-width: 200px;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 0.92rem;
        }
        input::placeholder {
            color: #b5c5ce;
        }
        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #70e1f5;
            color: #0f2027;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover {
            background: #9beaf8;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Keluarga Sihombing</h1>
        <p>Catatan Profil Anggota Keluarga &amp; Agenda Kebersamaan</p>
    </header>

    <div class="stats">
        <div class="stat-card">
            <div class="value" id="total-anggota">0</div>
            <div class="label">Jumlah Anggota</div>
        </div>
        <div class="stat-card">
            <div class="value" id="rata-usia">0</div>
            <div class="label">Rata-Rata Usia (Tahun)</div>
        </div>
        <div class="stat-card">
            <div class="value" id="total-agenda">0</div>
            <div class="label">Agenda Keluarga</div>
        </div>
    </div>

    <h2>Daftar Anggota Keluarga</h2>
    <div class="members-grid" id="members-grid"></div>

    <div class="agenda-box">
        <h2>Agenda Keluarga</h2>
        <ol class="agenda-list" id="agenda-list"></ol>
        <form class="agenda-form" onsubmit="tambahAgenda(event)">
            <input type="text" id="input-agenda" placeholder="Tulis agenda kumpul keluarga baru..." required>
            <button type="submit">+ Tambah Agenda</button>
        </form>
    </div>
</div>

<script>
    const dataAnggota = [
        { nama: "Tamba sihombing", peran: "Ayah", usia: 55, hobi: "Berkebun" },
        { nama: "Lamdinar Hutasoit", peran: "Ibu", usia: 50, hobi: "Memasak" },
        { nama: "Agung Sihombing", peran: "Anak Pertama", usia: 23, hobi: "Bermain Bola" },
        { nama: "Theresa Sihombing", peran: "Anak Kedua", usia: 21, hobi: "Membaca" },
        { nama: "Louis Sihombing", peran: "Anak Ketiga", usia: 20, hobi: "Bermain Voli" },
        { nama: "Gabriel Sihombing", peran: "Anak Keempat", usia: 18, hobi: "Bermain Musik" },
        { nama: "Sarah Sihombing", peran: "Anak Kelima", usia: 16, hobi: "Bermain futsal" }
    
    ];

    const daftarAgenda = [
        "Makan malam bersama setiap hari Minggu",
        "Kunjungan ke rumah kakek dan nenek",
        "Gotong royong membersihkan rumah akhir bulan"
    ];

    function renderSemua() {
        const grid = document.getElementById("members-grid");
        grid.innerHTML = "";

        dataAnggota.forEach(orang => {
            const card = document.createElement("div");
            card.className = "member-card";
            card.innerHTML = `
                <span class="role">${orang.peran}</span>
                <h3>${orang.nama}</h3>
                <p>Usia: <strong>${orang.usia} tahun</strong><br>Hobi utama: ${orang.hobi}</p>
            `;
            grid.appendChild(card);
        });

        const list = document.getElementById("agenda-list");
        list.innerHTML = "";
        daftarAgenda.forEach(item => {
            const li = document.createElement("li");
            li.textContent = item;
            list.appendChild(li);
        });

        const totalUsia = dataAnggota.reduce((acc, item) => acc + item.usia, 0);
        const rataUsia = dataAnggota.length > 0 ? (totalUsia / dataAnggota.length).toFixed(1) : "0";

        document.getElementById("total-anggota").textContent = dataAnggota.length;
        document.getElementById("rata-usia").textContent = rataUsia;
        document.getElementById("total-agenda").textContent = daftarAgenda.length;
    }

    function tambahAgenda(event) {
        event.preventDefault();
        const input = document.getElementById("input-agenda");
        const teks = input.value.trim();
        if (!teks) return;

        daftarAgenda.push(teks);
        input.value = "";
        renderSemua();
    }

    renderSemua();
</script>

</body>
</html>
